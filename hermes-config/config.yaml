    grok-4.5-free: medium
    grok-4.7-free: medium
    kilo-auto: medium
    kimi-k3-free: medium
    lfm-2.5-2.6b: medium
    ling-3.0-flash-sante: medium
    ling-3.1-flash: medium
    longcat-2.5-preview: medium
    mimo-v2.5: medium
    mimo-v2.6-flash: medium
    muse-spark-1.2-contributor: medium
    muse-spark-1.3-contributor: medium
    north-mini-code: medium
    qwen3.8-27b-free: medium
    qwen3.8-flash-free: medium
    sensenova-6.8-flash-lite: medium
    step-3.7-flash: medium
    space-bunny-alpha: medium
  service_tier: ""
  verbose: false
  run_budget_seconds: 2600
auth:
  adopt_external_logins: true
  codex_login_flow: device_code
auxiliary:
  compression:
    # 2026-10-29: реальное окно компрессора. Nemotron Lightning держит 838k входа
    # (проверено живым прогоном), 262144 безопасно.
    context_length: 262144
    # Локальная llama.cpp отключена (VRAM/swap). Компрессор = NVIDIA Nemotron Lightning.
    # ВАЖНО: model:'' + provider:auto отправляли сжатие на ОСНОВНУЮ модель с окном
    # 65536 → «Compacting context…» по кругу до таймаута 1800s. Только явный рабочий id.
    model: nvidia/nemotron-3.5-lightning-30b-a3b
    provider: nvidia
    timeout: 900
    no_progress_timeout: 300
  title_generation:
    model: mistralai/mistral-large-4-1t-a52b
    provider: nvidia
    timeout: 60
browser:
  cloud_provider: nous
  inactivity_timeout: 120
  use_real_profile: true
code_execution:
  max_tool_calls: 50
  timeout: 300
command_allowlist:
  - execute_code
  - recursive delete
  - script execution via -e/-c flag
compression:
  checkpoint_required: false
  codex_app_server_auto: native
  codex_gpt55_autoraise: true
  codex_responses_compact_threshold:
  codex_responses_native: false
  # 2026-10-04: Nemotron 3.5 Lightning 30B-A3B — удалённый компрессор сессий.
  # Живой тест: 3.2 с, чистый вывод. ВАЖНО: id требует префикс "nvidia/" (без него 404).
  compressor_model: nvidia/nemotron-3.5-lightning-30b-a3b
  enabled: true
  hygiene_max_turn_hold_seconds: 10
  idle_compact_after_seconds: 0
  max_attempts: 3
  min_tail_user_messages: 1
  proactive_prune_min_reclaim_tokens: 4096
  proactive_prune_min_result_chars: 8000
  proactive_prune_tokens: 0
  progress_notices: false
  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.2
  # Было 0.5: сжатие срабатывало на 32768 токенов, но protect_last_n:20 не даёт
  # ужать единственное пользовательское сообщение → "couldn't shrink it enough",
  # хотя запрос (41 806 токенов) отлично влезает в 65536. Теперь жмём только
  # у реального предела 80% = 52428 токенов.
  threshold: 0.8
  threshold_tokens: 200000
cron:
  catch_up_missed: true
  script_timeout_seconds: 3600
  max_parallel_jobs: 3
  model: mistralai/mistral-large-4-1t-a52b
  model_provider: nvidia
database:
  journal_mode: wal
delegation:
  max_iterations: 250
  model: mistralai/mistral-large-4-1t-a52b
  provider: nvidia
display:
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
  busy_input_mode: interrupt
  cleanup_progress: false
  compact: false
  skin: default
  streaming: true
  suppress_warning_notifications: false
  in_app_tips: false
  in_app_tours: false
gateway:
